<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="26" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <g stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 80 80 L 70 230" />
    <path d="M 320 80 L 330 230" />
    <path d="M 80 80 L 140 160" />
    <path d="M 320 80 L 260 160" />
    <path d="M 140 160 L 70 230" />
    <path d="M 260 160 L 330 230" />
    <path d="M 140 160 L 200 240" />
    <path d="M 260 160 L 200 240" />
    <path d="M 70 230 L 200 330" />
    <path d="M 330 230 L 200 330" />
    <path d="M 200 240 L 200 330" />
  </g>

  <g filter="url(#glow)">
    <circle cx="80" cy="80" r="12" fill="#336791" stroke="#FFD43B" stroke-width="3"/>
    <circle cx="320" cy="80" r="12" fill="#336791" stroke="#FFD43B" stroke-width="3"/>

    <circle cx="140" cy="160" r="14" fill="#336791" stroke="#FFD43B" stroke-width="3"/>
    <circle cx="260" cy="160" r="14" fill="#336791" stroke="#FFD43B" stroke-width="3"/>

    <circle cx="70" cy="230" r="14" fill="#336791" stroke="#FFD43B" stroke-width="3"/>
    <circle cx="330" cy="230" r="14" fill="#336791" stroke="#FFD43B" stroke-width="3"/>

    <circle cx="200" cy="240" r="16" fill="#336791" stroke="#FFD43B" stroke-width="3"/>

    <rect x="180" y="310" width="40" height="40" rx="8" fill="#FFD43B" stroke="#336791" stroke-width="4"/>
  </g>
</svg>
