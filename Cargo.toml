[package]
name = "topcat"
version = "0.3.0"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["josha@jci.dev", ]

description = "A tool for concatenating files in topological order"
documentation = "https://docs.rs/topcat/"
repository = "https://github.com/joshainglis/topcat"

keywords = ["topological", "concatenation", "file", "dependency", "graph"]
categories = [
    "command-line-utilities",
    "development-tools",
    "filesystem",
    "template-engine",
]

rust-version = "1.88.0"
edition = "2024"

[package.metadata.release]
no-dev-version = true

[profile.release]

[profile.bench]
debug = true

[dependencies]
petgraph = { version = "0.8.3" }
glob = { version = "0.3.3" }
clap = { version = "4.5", features = ["derive", "cargo"] }
log = { version = "0.4.28" }
env_logger = { version = "0.11.8" }
graph-cycles = { version = "0.3.0" }
regex = { version = "1.12.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.9.8" }
config = { version = "0.15", default-features = false, features = ["toml"] }
dirs = { version = "6.0" }
indicatif = { version = "0.18.2" }
rayon = { version = "1.10" }
comfy-table = { version = "7.1" }
chrono = { version = "0.4" }
quick-xml = { version = "0.38", features = ["serialize"] }
indexmap = { version = "2.12", features = ["serde"] }

[dev-dependencies]
tempfile = { version = "3.23.0" }
proptest = "1.5"
rand = "0.9"
criterion = { version = "0.7.0", features = ["html_reports"] }
assert_cmd = "2.0"
predicates = "3.0"

[[bench]]
name = "graph_benchmarks"
harness = false
