# pg-dev-buddy milestone manifest.
#
# Single source of truth for the runner script (scripts/pg-dev-buddy/run-milestone.sh)
# and the human-readable assignment doc (MODEL-ASSIGNMENTS.md). If you change
# `model` or `prereqs` here, mirror it in MODEL-ASSIGNMENTS.md.
#
# Models:
#   "haiku"  — extremely simple, mechanical, low correctness risk
#   "sonnet" — bounded contract, mainly orchestration / extending existing patterns
#   "opus"   — novel algorithms, multi-source reconciliation, identity primitives,
#              correctness-load-bearing invariants, tricky transactional semantics
#
# Prereqs are milestone ids that must be merged before this one starts.

[milestone.m00]
title    = "Config and command scaffolding"
file     = "m00-scaffolding.md"
model    = "sonnet"
prereqs  = []

